<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="jotti — Gastronomie-Kassensystem (POS) für Vereine und Non-Profit-Veranstaltungen. Self-hosted, Mobile-first, kein Cloud-Abo."
    />
    <title>jotti</title>

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/jotti-icon-light-16.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/jotti-icon-light-32.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/jotti-icon-dark-16.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/jotti-icon-dark-32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/jotti-icon-light-32.png"
    />

    <link rel="apple-touch-icon" href="/icons/jotti-logo-icon-light.png" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <meta
      name="theme-color"
      content="#007a55"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0c0c09"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
