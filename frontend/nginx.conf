server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  index index.html;

  # gzip for text-based responses (HTML is always compressed when gzip is on).
  # Caddy marks proxied requests with Via, which nginx skips unless gzip_proxied.
  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 256;
  gzip_comp_level 6;
  gzip_types text/css text/javascript application/javascript image/svg+xml application/xml text/xml text/plain application/manifest+json;

  # SPA routing: serve index.html for all non-file routes. HTML is never
  # cached so clients pick up new content-hashed bundles right after a deploy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Vite build output: every file name carries a content hash — cache forever
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Unhashed static files from public/ (favicons): short max-age
  location ~* \.(?:ico|png|svg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # PWA manifest: missing from nginx's default mime.types
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "public, max-age=3600";
  }
}
