    <div style="padding: 8px; display: flex; flex-direction: column;">

      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="{{ s_produkte }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg>

        <div style="{{ s_tische }}">

        <div style="{{ s_benutzer }}">

        <div style="{{ s_kasse }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>

          <span>Druckstationen</span>
        </div>
        <div style="{{ s_finanzamt }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18v-7"></path><path d="M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949z"></path><path d="M14 18v-7"></path><path d="M18 18v-7"></path><path d="M3 22h18"></path><path d="M6 18v-7"></path></svg>

        </div>
      </div>
    </div>
    <div style="padding: 8px; display: flex; flex-direction: column;">
      <div style="height: 32px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 500; color: color-mix(in oklab, oklch(0.153 0.006 107.1) 70%, transparent);">Service</div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="{{ s_service }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12v6"></path><path d="M4.077 10.615A1 1 0 0 0 5 12h14a1 1 0 0 0 .923-1.385l-3.077-7.384A2 2 0 0 0 15 2H9a2 2 0 0 0-1.846 1.23Z"></path><path d="M8 20a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z"></path></svg>

      </div>
    </div>
    <div style="padding: 8px; display: flex; flex-direction: column;">
      <div style="height: 32px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 500; color: color-mix(in oklab, oklch(0.153 0.006 107.1) 70%, transparent);">Einstellungen</div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="{{ s_theme }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg>

    <div style="padding: 8px; display: flex; flex-direction: column;">

        <div style="{{ s_logout }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path></svg>
          <span>Abmelden</span>
        </div>
      </div>
    </div>
  </div>
  <div style="padding: 8px; display: flex; flex-direction: column; gap: 8px;">
    <p style="margin: 0; text-align: center; font-size: 14px; color: oklch(0.53 0.031 107.3);">jotti 1.0.0</p>
    <p style="margin: 0 0 4px; text-align: center; font-size: 14px; color: oklch(0.53 0.031 107.3);">Entwickelt von Nico Gräf</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:256,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;berichte&quot;,&quot;produkte&quot;,&quot;tische&quot;,&quot;benutzer&quot;,&quot;kasse&quot;,&quot;druck&quot;,&quot;finanzamt&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? '';
    const base = {
      display: 'flex', alignItems: 'center', gap: '8px', height: '32px',
      boxSizing: 'border-box', padding: '8px', borderRadius: '5.2px',
      fontSize: '14px', lineHeight: '20px', color: 'oklch(0.153 0.006 107.1)',
      fontWeight: 400, background: 'transparent', cursor: 'pointer', whiteSpace: 'nowrap'
    };
    const activeStyle = Object.assign({}, base, {
      background: 'oklch(0.966 0.005 106.5)', fontWeight: 500,
      color: 'oklch(0.228 0.013 107.4)'
    });
    const keys = ['dashboard', 'berichte', 'produkte', 'tische', 'benutzer', 'kasse', 'druck', 'finanzamt', 'service', 'theme', 'logout'];
    const vals = {};
    for (const k of keys) vals['s_' + k] = (k === active) ? activeStyle : base;
    return vals;
  }
}
</script>
</body>
</html>
