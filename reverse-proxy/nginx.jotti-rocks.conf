## Nginx config for the jotti.rocks project deployment
## Landing page at https://jotti.rocks/, demo app at https://demo.jotti.rocks/
## This file is NOT used by self-hosters — see nginx.conf instead.

# Rate limiting: 10 requests/second per IP, burst 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Cache-Control by response content type: fonts and images are long-lived
# and immutable, CSS/JS get a short max-age (file names never change),
# HTML is not cached (SSI-rendered). No match (empty value) adds no header.
map $sent_http_content_type $cache_control {
  ~^text/html                      "no-cache";
  ~^text/css                       "public, max-age=3600";
  ~^(text|application)/javascript  "public, max-age=3600";
  ~^font/                          "public, max-age=31536000, immutable";
  ~^image/                         "public, max-age=31536000, immutable";
}

### HTTP server — redirect to HTTPS and serve ACME challenges
server {
  listen 80;
  server_name jotti.rocks www.jotti.rocks demo.jotti.rocks;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

### Redirect www to non-www (HTTPS)
server {
  listen 443 ssl;
  http2 on;
  server_name www.jotti.rocks;

  ssl_certificate /etc/letsencrypt/live/jotti.rocks/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jotti.rocks/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  return 301 https://jotti.rocks$request_uri;
}

### Landing page — https://jotti.rocks (static files)
server {
  listen 443 ssl;
  http2 on;
  server_name jotti.rocks;

  ssl_certificate /etc/letsencrypt/live/jotti.rocks/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jotti.rocks/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer-when-downgrade always;
  add_header Permissions-Policy "geolocation=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; upgrade-insecure-requests" always;

  # gzip for text-based responses (HTML is always compressed when gzip is on)
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_comp_level 6;
  gzip_types text/css text/javascript application/javascript image/svg+xml application/xml text/xml text/plain;

  # Cache-Control via server-level add_header — a location-level add_header
  # would drop all server-level security headers (nginx inheritance rules)
  add_header Cache-Control $cache_control always;

  root /usr/share/nginx/html/landing;
  index index.html;
  ssi on;

  # Serve the branded 404 page for unknown URLs
  error_page 404 /404.html;

  # Shared HTML partials — only includable via SSI, not directly reachable
  location ^~ /partials/ {
    internal;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}

### Demo app — https://demo.jotti.rocks (frontend SPA + backend API)
server {
  listen 443 ssl;
  http2 on;
  server_name demo.jotti.rocks;

  ssl_certificate /etc/letsencrypt/live/jotti.rocks/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jotti.rocks/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Security headers (CSP enforced)
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer-when-downgrade always;
  add_header Permissions-Policy "geolocation=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; media-src 'self'; frame-src 'none'; object-src 'none'; upgrade-insecure-requests" always;

  # Backend API under /api/ (strip prefix when proxying)
  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # Frontend SPA root
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
