## HTTP-only nginx reverse proxy for local / LAN deployment (no domain, no TLS).
##
## Serves the frontend SPA at http://<host>/ and proxies the backend API under
## http://<host>/api/*. Intended for self-hosting on a single PC/laptop in a trusted
## local network — e.g. a small club running one direct-sales till on one device,
## operated from a tablet via WLAN over the host's local IP address.
##
## SECURITY: Traffic is unencrypted plain HTTP. Use ONLY inside a trusted local
## network. Never expose this configuration to the public internet.
##
## Used by docker-compose.local.yml. See docs/betrieb/leitfaden-hosting.md.

# Rate limiting: 10 requests/second per IP, burst 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  # Security headers — no HSTS and no upgrade-insecure-requests (this is plain HTTP)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer-when-downgrade always;
  add_header Permissions-Policy "geolocation=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; media-src 'self'; frame-src 'none'; object-src 'none'" always;

  # Backend API under /api/ (strip prefix when proxying)
  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # Frontend SPA root
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
