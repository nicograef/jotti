# Catch-all HTTP server for initial Let's Encrypt certificate issuance:
# `default_server` wins over the conf.d/default.conf the nginx image ships, so the
# ACME HTTP-01 challenge is served for every Host on port 80.
server {
  listen 80 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
}
