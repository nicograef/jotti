# Catch-all HTTP server for initial Let's Encrypt certificate issuance.
# `default_server` makes this block handle every Host on port 80 — even though
# the nginx image also ships its own conf.d/default.conf — so the ACME HTTP-01
# challenge is served for any domain. Self-hosters don't need to edit this file.
server {
  listen 80 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
}
