## Nginx config for the local website preview (make website).
## Mirrors the jotti.rocks landing page setup so SSI includes render
## identically to production. NOT used in any deployment.

# Cache-Control by response content type: fonts and images are long-lived
# and immutable, CSS/JS get a short max-age (file names never change),
# HTML is not cached (SSI-rendered). No match (empty value) adds no header.
map $sent_http_content_type $cache_control {
  ~^text/html                      "no-cache";
  ~^text/css                       "public, max-age=3600";
  ~^(text|application)/javascript  "public, max-age=3600";
  ~^font/                          "public, max-age=31536000, immutable";
  ~^image/                         "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name localhost;

  # gzip for text-based responses (HTML is always compressed when gzip is on)
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_comp_level 6;
  gzip_types text/css text/javascript application/javascript image/svg+xml application/xml text/xml text/plain;

  # Cache-Control via server-level add_header — a location-level add_header
  # would drop all server-level security headers (nginx inheritance rules)
  add_header Cache-Control $cache_control always;

  root /usr/share/nginx/html;
  index index.html;
  ssi on;

  # Serve the branded 404 page for unknown URLs
  error_page 404 /404.html;

  # Shared HTML partials — only includable via SSI, not directly reachable
  location ^~ /partials/ {
    internal;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
