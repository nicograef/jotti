## Nginx config for the local website preview (make website).
## Mirrors the jotti.rocks landing page setup so SSI includes render
## identically to production. NOT used in any deployment.

server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;
  ssi on;

  # Shared HTML partials — only includable via SSI, not directly reachable
  location ^~ /partials/ {
    internal;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
