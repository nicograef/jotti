## Nginx config for the jotti.rocks project deployment: landing page at
## https://jotti.rocks/, demo app at https://demo.jotti.rocks/.
## NOT used by self-hosters — they run the Caddy reverse proxy
## (reverse-proxy/caddyfile.go, wired up in docker-compose.prod.yml).

# Access logs with truncated IP addresses (privacy): the last IPv4 octet (or the
# IPv6 host part) is removed before writing; the full IP is still used in memory for
# rate limiting. The privacy policy (website/src/pages/datenschutz.astro) describes
# exactly this — keep both in sync. Server blocks opt in via `access_log`.
map $remote_addr $remote_addr_anon {
  ~(?P<ip>\d+\.\d+\.\d+)\.  $ip.0;
  ~(?P<ip>[^:]+:[^:]+):     $ip::;
  default                   0.0.0.0;
}
log_format anonymized '$remote_addr_anon - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Strict limit for acme-dns registrations (open registration, abuse protection):
# a jotti installation registers exactly once, so 1 request/minute per IP is plenty
limit_req_zone $binary_remote_addr zone=acmedns_register:1m rate=1r/m;

# Redirect map for renamed or moved docs routes: old /docs/<slug>/ → new URL.
# Empty default = no redirect.
# Example: "/docs/leitfaden/alter-name/" "/docs/leitfaden/neuer-name/";
map $uri $docs_redirect {
  default "";
}

server {
  listen 80;
  server_name jotti.rocks www.jotti.rocks demo.jotti.rocks auth.jotti.rocks;
  access_log /var/log/nginx/access.log anonymized;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.jotti.rocks;
  access_log /var/log/nginx/access.log anonymized;

  ssl_certificate /etc/letsencrypt/live/jotti.rocks/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jotti.rocks/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  return 301 https://jotti.rocks$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name jotti.rocks;
  access_log /var/log/nginx/access.log anonymized;

  ssl_certificate /etc/letsencrypt/live/jotti.rocks/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jotti.rocks/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # 'wasm-unsafe-eval' is required by Pagefind (Starlight's search): the docs search
  # index runs as WebAssembly, which script-src otherwise blocks.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer-when-downgrade always;
  add_header Permissions-Policy "geolocation=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; upgrade-insecure-requests" always;

  # SEO continuity: these URLs now live in the docs Leitfaden.
  location = /leitfaden-fuer-vereine/ {
    return 301 https://jotti.rocks/docs/leitfaden/was-ist-jotti/;
  }
  location = /leitfaden-fuer-vereine {
    return 301 https://jotti.rocks/docs/leitfaden/was-ist-jotti/;
  }
  location = /jotti-selbst-betreiben/ {
    return 301 https://jotti.rocks/docs/leitfaden/was-ist-jotti/;
  }
  location = /jotti-selbst-betreiben {
    return 301 https://jotti.rocks/docs/leitfaden/was-ist-jotti/;
  }

  if ($docs_redirect) {
    return 301 $docs_redirect;
  }

  location / {
    proxy_pass http://website:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name demo.jotti.rocks;
  access_log /var/log/nginx/access.log anonymized;

  ssl_certificate /etc/letsencrypt/live/jotti.rocks/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jotti.rocks/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer-when-downgrade always;
  add_header Permissions-Policy "geolocation=(), microphone=()" always;
  # CSP: verbatim copy of contentSecurityPolicy in caddyfile.go, held together
  # by TestNginxRocksConfCarriesSameCSP
  add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; media-src 'self'; frame-src 'none'; object-src 'none'; upgrade-insecure-requests" always;

  # Backend API under /api/ — the trailing slash in proxy_pass strips the prefix.
  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name auth.jotti.rocks;
  access_log /var/log/nginx/access.log anonymized;

  ssl_certificate /etc/letsencrypt/live/jotti.rocks/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jotti.rocks/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

  location = /register {
    limit_req zone=acmedns_register burst=3 nodelay;
    limit_req_status 429;

    proxy_pass http://acme-dns:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # /update (credential-protected) and /health
  location / {
    proxy_pass http://acme-dns:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
