# git-cliff configuration — jotti's GitHub release notes from Conventional
# Commits; only feat and fix are shown (see commit_parsers).

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }}
{%- endfor %}
{% endfor %}
{% if previous and previous.version and version %}
**Full Changelog**: https://github.com/nicograef/jotti/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
# Compare-Link am Body-Ende statt im `footer`: `version`/`previous` sind im
# `footer`-Kontext nicht verfügbar, und je Lauf wird genau ein Release
# gerendert, also steht der Link ohnehin unten.
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
# Reihenfolge zählt — der erste passende Parser gewinnt:
#   1. `scope = website` zuerst, sonst greifen feat/fix davor. Scope wird über
#      `field`/`pattern` gematcht; ein blankes `scope =` filtert nicht.
#   2. Breaking vor feat/fix, sonst landen feat!/fix! in feat/fix. Das
#      `breaking`-Flag deckt `typ!:` und den `BREAKING CHANGE`-Footer ab.
# Das <!-- N -->-Präfix steuert die Gruppen-Sortierung und wird per `striptags`
# entfernt.
commit_parsers = [
  { field = "scope", pattern = "website", skip = true },
  { field = "breaking", pattern = "true", group = "<!-- 0 -->⚠️ Breaking Changes" },
  { message = "^feat", group = "<!-- 1 -->✨ Neue Funktionen" },
  { message = "^fix",  group = "<!-- 2 -->🐛 Fehlerbehebungen" },
  { message = ".*", skip = true },
]
tag_pattern = "v[0-9]*"
