# Release variant of the LAN stack: ships inside the Windows release ZIP and is
# what jotti-start.exe runs. Same shape as docker-compose.local.yml, but the four
# buildable services pull pre-built GHCR images — the ZIP carries no source tree.
# The tag `RELEASE_VERSION` is a placeholder that the release workflow pins before
# the ZIP is assembled, so this committed file is a template, never runnable as-is.
# Project name and volume names match the local file on purpose: a ZIP upgrade
# reuses the volumes, so data AND Caddy certificates survive.
# SECURITY: never expose this stack to the public internet (no port forwarding).

name: jotti-local

# Log rotation that needs no daemon configuration, so it applies on any host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.8
    container_name: jotti-postgres-local
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jotti
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # jotti-config holds the install secret (.env mirror) the starter writes
      # before the stack comes up. Mounted read-only only to bind its lifecycle
      # to the data: `down -v` removes secret and database together, so a stale
      # secret cannot lock you out. Postgres never reads it.
      - jotti-config:/jotti-config:ro
      # jotti-backups holds the timestamped pre-update pg_dumps the starter
      # writes before migrating a new version; rw so the dump lands straight in
      # the volume, lifecycle bound to the data like jotti-config.
      - jotti-backups:/jotti-backups
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d jotti"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/nicograef/jotti-migrate:RELEASE_VERSION
    container_name: jotti-migrate-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - db-network
    # No migrations bind mount: they are baked into the jotti-migrate image, so
    # the ZIP needs no database/migrations folder.
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ghcr.io/nicograef/jotti-backend:RELEASE_VERSION
    container_name: jotti-backend-local
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DBNAME: jotti
      JWT_SECRET: ${JWT_SECRET}
      RELAY_AUTH_TOKEN: ${RELAY_AUTH_TOKEN}
    networks:
      - app-network
      - db-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/health >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    image: ghcr.io/nicograef/jotti-frontend:RELEASE_VERSION
    container_name: jotti-frontend-local
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  reverse-proxy:
    image: ghcr.io/nicograef/jotti-reverse-proxy:RELEASE_VERSION
    container_name: jotti-reverse-proxy-local
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Host LAN IP, detected on the host and passed in by jotti-start.exe
      # (a bridged container can only see its docker-bridge IP, which phones
      # cannot reach). Empty ⇒ only the fallback site is announced.
      LAN_IP: ${LAN_IP:-}
      ACMEDNS_BASE_URL: ${ACMEDNS_BASE_URL:-https://auth.jotti.rocks}
      # Set to 1 in development to issue via the Let's Encrypt staging CA.
      PROXY_LE_STAGING: ${PROXY_LE_STAGING:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Status page: bound to host loopback only — visible on the till PC, never
      # on the WLAN.
      - "127.0.0.1:8484:8484"
    volumes:
      - caddy-data:/data
      - proxy-state:/state
    networks:
      - app-network
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S -O /dev/null http://127.0.0.1:80/ 2>&1 | grep -qE 'HTTP/1.[01] (2|3)[0-9][0-9]'",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  caddy-data:
  proxy-state:
  jotti-config:
  jotti-backups:
