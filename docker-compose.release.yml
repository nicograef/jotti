# Release variant of the local / LAN stack — runs entirely from pre-built images.
#
# This file ships inside the Windows release ZIP and is what jotti-start.exe runs.
# It is identical in shape to docker-compose.local.yml, but the four buildable
# services (migrate, backend, frontend, reverse-proxy) pull pre-built images from
# GHCR instead of building from source — the ZIP contains no source tree, so a
# `--build` would have nothing to build.
#
# The image tag `RELEASE_VERSION` is a placeholder. The release workflow pins it
# to the exact version (e.g. v0.1.0) before the ZIP is assembled; this committed
# file therefore stays a template and is never runnable as-is.
#
# Same project name (jotti-local) and named volumes as the local file on purpose:
# a ZIP upgrade reuses the same volumes, so data AND Caddy certificates survive.
#
# Start:  docker compose -f docker-compose.release.yml up -d
# Stop:   docker compose -f docker-compose.release.yml down  (or jotti-stop.cmd)
#
# SECURITY: Never expose this stack to the public internet (no port forwarding).

name: jotti-local

services:
  postgres:
    image: postgres:17.8
    container_name: jotti-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jotti
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # jotti-config holds the install secret (.env mirror), written by the
      # starter before the stack comes up. It is mounted read-only here only to
      # bind its lifecycle to the data: `docker compose down -v` then removes the
      # secret together with the database, so a stale secret can never outlive —
      # or lock you out of — the data it unlocks. Postgres itself never reads it.
      - jotti-config:/jotti-config:ro
      # jotti-backups holds the timestamped pre-update pg_dumps that the starter
      # writes (via `docker exec`) before running migrations on a new version.
      # Mounted rw so the dump lands straight in the volume; its lifecycle is
      # likewise bound to the data (`down -v` removes both).
      - jotti-backups:/jotti-backups
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d jotti"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/nicograef/jotti-migrate:RELEASE_VERSION
    container_name: jotti-migrate-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - db-network
    # Kein Migrations-Bind-Mount: die Migrationen sind ins jotti-migrate-Image
    # gebacken (COPY), der Stack ist damit selbst-enthalten — das Release-ZIP
    # braucht den database/migrations-Ordner nicht mehr.
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ghcr.io/nicograef/jotti-backend:RELEASE_VERSION
    container_name: jotti-backend-local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DBNAME: jotti
      JWT_SECRET: ${JWT_SECRET}
      RELAY_AUTH_TOKEN: ${RELAY_AUTH_TOKEN}
    networks:
      - app-network
      - db-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # No exposed ports; reachable only via reverse proxy

  frontend:
    image: ghcr.io/nicograef/jotti-frontend:RELEASE_VERSION
    container_name: jotti-frontend-local
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_started
    # No exposed ports; served via reverse proxy

  reverse-proxy:
    image: ghcr.io/nicograef/jotti-reverse-proxy:RELEASE_VERSION
    container_name: jotti-reverse-proxy-local
    restart: unless-stopped
    environment:
      # Host LAN IP, detected on the host and passed in by jotti-start.exe
      # (a bridged container can only see its docker-bridge IP, which phones
      # cannot reach). Empty ⇒ only the fallback site is announced.
      LAN_IP: ${LAN_IP:-}
      ACMEDNS_BASE_URL: ${ACMEDNS_BASE_URL:-https://auth.jotti.rocks}
      # Set to 1 in development to issue via the Let's Encrypt staging CA.
      PROXY_LE_STAGING: ${PROXY_LE_STAGING:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Status page: bound to host loopback only — visible on the till PC, never
      # on the WLAN.
      - "127.0.0.1:8484:8484"
    volumes:
      - caddy-data:/data
      - proxy-state:/state
    networks:
      - app-network
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  caddy-data:
  proxy-state:
  # Source of truth for the install secret; see the postgres mount above.
  jotti-config:
  # Timestamped pre-update database dumps; see the postgres mount above.
  jotti-backups:
