name: jotti

# Self-hosted production stack for a single public domain.
#
# Runs entirely from pinned GHCR images (no build from source on the server) and
# terminates TLS with Caddy in public mode: set JOTTI_DOMAIN + LETSENCRYPT_EMAIL
# in .env and Caddy obtains and renews a Let's Encrypt certificate automatically
# (HTTP-01/TLS-ALPN). No certbot, no manual certificate choreography, no editing
# of tracked files. See docs/leitfaden/self-hosting.md (Experten-Weg, eigener Server).
#
# Image versions are pinned via ${JOTTI_VERSION} (default: latest).
#
# First deploy:  make prod-init     (validates .env/DNS, pulls, starts, verifies)
# Update:        make prod-update    (pre-update backup, pull, migrate, verify)
# Logs:          make prod-logs
#
# The jotti.rocks demo uses docker-compose.rocks.yml instead (nginx + certbot).

services:
  postgres:
    image: postgres:17.8
    container_name: jotti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jotti
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d jotti"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"

  migrate:
    image: ghcr.io/nicograef/jotti-migrate:${JOTTI_VERSION:-latest}
    container_name: jotti-migrate
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - db-network
    # No migrations bind mount: the migrations are baked into the jotti-migrate
    # image (COPY), so the pinned stack is self-contained.
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ghcr.io/nicograef/jotti-backend:${JOTTI_VERSION:-latest}
    container_name: jotti-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DBNAME: jotti
      JWT_SECRET: ${JWT_SECRET}
      RELAY_AUTH_TOKEN: ${RELAY_AUTH_TOKEN}
    networks:
      - app-network
      - db-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/health >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.5"
    # No exposed ports; reachable only via reverse proxy

  frontend:
    image: ghcr.io/nicograef/jotti-frontend:${JOTTI_VERSION:-latest}
    container_name: jotti-frontend
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    # No exposed ports; served via reverse proxy

  reverse-proxy:
    image: ghcr.io/nicograef/jotti-reverse-proxy:${JOTTI_VERSION:-latest}
    container_name: jotti-reverse-proxy
    restart: unless-stopped
    environment:
      # JOTTI_DOMAIN switches the image into public mode: one site for this
      # domain with an automatic Let's Encrypt certificate.
      JOTTI_DOMAIN: ${JOTTI_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      # Optional: redirect www.<domain> to <domain> (needs www DNS to point here).
      JOTTI_WWW_REDIRECT: ${JOTTI_WWW_REDIRECT:-}
      # Set to 1 to issue via the Let's Encrypt staging CA while testing.
      PROXY_LE_STAGING: ${PROXY_LE_STAGING:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
    networks:
      - app-network
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  # Caddy's data dir holds the Let's Encrypt certificates and ACME account.
  caddy-data:
