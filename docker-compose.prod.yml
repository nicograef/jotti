name: jotti

# Self-hosted production stack for a single public domain: pinned GHCR images
# (nothing is built on the server), TLS terminated by Caddy in public mode —
# JOTTI_DOMAIN + LETSENCRYPT_EMAIL in .env, certificate obtained and renewed
# automatically (HTTP-01/TLS-ALPN), no certbot. ${JOTTI_VERSION} is required and
# has no default. See docs/leitfaden/self-hosting.md; the jotti.rocks demo uses
# docker-compose.rocks.yml instead.

# Log rotation that needs no daemon configuration, so it applies on any host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.8
    container_name: jotti-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jotti
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d jotti"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"

  migrate:
    image: ghcr.io/nicograef/jotti-migrate:${JOTTI_VERSION}
    container_name: jotti-migrate
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - db-network
    # No migrations bind mount: the migrations are baked into the jotti-migrate
    # image (COPY), so the pinned stack is self-contained.
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ghcr.io/nicograef/jotti-backend:${JOTTI_VERSION}
    container_name: jotti-backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DBNAME: jotti
      JWT_SECRET: ${JWT_SECRET}
      RELAY_AUTH_TOKEN: ${RELAY_AUTH_TOKEN}
    networks:
      - app-network
      - db-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/health >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.5"

  frontend:
    image: ghcr.io/nicograef/jotti-frontend:${JOTTI_VERSION}
    container_name: jotti-frontend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  reverse-proxy:
    image: ghcr.io/nicograef/jotti-reverse-proxy:${JOTTI_VERSION}
    container_name: jotti-reverse-proxy
    restart: unless-stopped
    logging: *default-logging
    environment:
      # JOTTI_DOMAIN switches the image into public mode: one site for this
      # domain with an automatic Let's Encrypt certificate. Required, with no
      # default: an empty value leaves the image no mode at all, because it
      # refuses LAN mode without the state directory this stack never mounts.
      JOTTI_DOMAIN: ${JOTTI_DOMAIN:?JOTTI_DOMAIN ist im Public-Stack Pflicht}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      # Optional: redirect www.<domain> to <domain> (needs www DNS to point here).
      JOTTI_WWW_REDIRECT: ${JOTTI_WWW_REDIRECT:-}
      # Set to 1 to issue via the Let's Encrypt staging CA while testing.
      PROXY_LE_STAGING: ${PROXY_LE_STAGING:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
    networks:
      - app-network
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S -O /dev/null http://127.0.0.1:80/ 2>&1 | grep -qE 'HTTP/1.[01] (2|3)[0-9][0-9]'",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  # Caddy's data dir holds the Let's Encrypt certificates and ACME account.
  caddy-data:
