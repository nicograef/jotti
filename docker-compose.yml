name: jotti-dev

# Log rotation for every long-running service: json-file capped at a small size
# and a few files, so it takes effect on any host without daemon configuration.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.8
    container_name: jotti-postgres-dev
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jotti
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d jotti"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./database
      dockerfile: migrate/Dockerfile
    container_name: jotti-migrate-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app-network
    volumes:
      - ./database/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend-dev:
    image: golang:1.26.5-alpine
    container_name: jotti-backend-dev
    working_dir: /src
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DBNAME: jotti
      JWT_SECRET: ${JWT_SECRET}
      RELAY_AUTH_TOKEN: ${RELAY_AUTH_TOKEN}
      # Dev/Demo: schaltet nur das CLI-Subkommando `jotti seed` (`make seed`) frei,
      # nicht den HTTP-Endpoint. In Prod/Release nie gesetzt.
      JOTTI_ALLOW_SEED: "1"
    command: sh -c "go mod download && go run ./main.go"
    volumes:
      - ./backend:/src
    networks:
      - app-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  frontend-dev:
    image: node:24-alpine
    container_name: jotti-frontend-dev
    working_dir: /app
    logging: *default-logging
    environment:
      NODE_ENV: development
      CI: "true"
      BACKEND_HOST: backend-dev
    command: sh -c "corepack enable && pnpm install && pnpm run dev --host"
    ports:
      - "80:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-pnpm-store:/app/.pnpm-store
    networks:
      - app-network
    depends_on:
      backend-dev:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  frontend-node-modules:
  frontend-pnpm-store:
