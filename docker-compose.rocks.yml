name: jotti

# Standalone Docker Compose file for the jotti.rocks project deployment.
# Runs the full stack (postgres, backend, frontend, website) and the DNS
# infrastructure for trusted local TLS (resolver + acme-dns). The reverse proxy
# terminates TLS and routes jotti.rocks to the website container (Astro build)
# and demo.jotti.rocks to the frontend; see docs/jotti-rocks-infra.md.
#
# Usage:
#   docker compose -f docker-compose.rocks.yml up -d --build
#
# This file is NOT used by self-hosters — they use docker-compose.prod.yml alone.
#
# Requires VPS_PUBLIC_IP in .env (public IPv4 of this server) and
# Docker Compose >= 2.23.1 (inline configs with interpolation).

# Log rotation for every long-running service: json-file capped at a small size
# and a few files, so it takes effect on any host without daemon configuration.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.8
    container_name: jotti-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jotti
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d jotti"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"

  migrate:
    build:
      context: ./database
      dockerfile: migrate/Dockerfile
    container_name: jotti-migrate
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - db-network
    volumes:
      - ./database/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jotti-backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DBNAME: jotti
      JWT_SECRET: ${JWT_SECRET}
      RELAY_AUTH_TOKEN: ${RELAY_AUTH_TOKEN}
      # Demo/Staging: schaltet den Seed-Befehl frei (reset-and-seed.sh). In Prod/Release nie gesetzt.
      JOTTI_ALLOW_SEED: "1"
    networks:
      - app-network
      - db-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/health >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.5"
    # No exposed ports; reachable only via reverse proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jotti-frontend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    # No exposed ports; served via reverse proxy

  # Marketing landing + docs (Astro + Starlight). The build context is the repo
  # root because Astro reads the published Markdown straight from docs/.
  website:
    build:
      context: .
      dockerfile: website/Dockerfile
    container_name: jotti-website
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    # No exposed ports; served via reverse proxy

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: jotti-reverse-proxy
    restart: unless-stopped
    logging: *default-logging
    # nginx runs in the foreground as PID 1 and receives stop signals directly;
    # a background loop reloads every 12 hours so renewed certificates and
    # re-resolved upstream addresses are picked up without a restart.
    command:
      - sh
      - -c
      - "while true; do sleep 12h; nginx -s reload; done & exec nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.rocks.conf:/etc/nginx/conf.d/jotti.conf:ro
      - certbot-challenges:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - app-network
    depends_on:
      frontend:
        condition: service_started
      website:
        condition: service_started
      backend:
        condition: service_healthy
      acme-dns:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S -O /dev/null http://127.0.0.1:80/ 2>&1 | grep -qE 'HTTP/1.[01] (2|3)[0-9][0-9]'",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: jotti-certbot
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - certbot-challenges:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - app-network
    depends_on:
      reverse-proxy:
        condition: service_started
    entrypoint: /bin/sh
    command: -c "while true; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 24h; done"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  # Authoritative DNS for lokal.jotti.rocks — computes A records and
  # _acme-challenge CNAMEs from the queried name, forwards auth.jotti.rocks
  # queries to acme-dns. The only process bound to public port 53.
  resolver:
    build:
      context: ./resolver
      dockerfile: Dockerfile
    container_name: jotti-resolver
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      RESOLVER_NS_IP: ${VPS_PUBLIC_IP}
      RESOLVER_AUTH_FORWARD: acme-dns:53
    networks:
      - app-network
    depends_on:
      acme-dns:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  # acme-dns serves the auth.jotti.rocks zone (DNS-01 challenge TXT records).
  # DNS (:53) and HTTP API (:80) are Docker-internal only: DNS is reached via
  # the resolver's conditional forwarding, the API via nginx
  # (https://auth.jotti.rocks).
  acme-dns:
    image: joohoi/acme-dns:v2.0.2
    container_name: jotti-acme-dns
    restart: unless-stopped
    logging: *default-logging
    configs:
      - source: acme-dns-config
        target: /etc/acme-dns/config.cfg
    volumes:
      - acme-dns-data:/var/lib/acme-dns
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

configs:
  acme-dns-config:
    content: |
      [general]
      listen = "0.0.0.0:53"
      protocol = "both"
      domain = "auth.jotti.rocks"
      nsname = "dns.jotti.rocks"
      nsadmin = "graef.nico.gmail.com"
      records = [
          "auth.jotti.rocks. A ${VPS_PUBLIC_IP}",
          "auth.jotti.rocks. NS dns.jotti.rocks.",
      ]
      debug = false

      [database]
      engine = "sqlite"
      connection = "/var/lib/acme-dns/acme-dns.db"

      [api]
      ip = "0.0.0.0"
      disable_registration = false
      port = "80"
      tls = "none"
      corsorigins = [
          "*"
      ]
      use_header = true
      header_name = "X-Forwarded-For"

      [logconfig]
      loglevel = "info"
      logtype = "stdout"
      logformat = "text"

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  certbot-challenges:
  letsencrypt:
  acme-dns-data:
