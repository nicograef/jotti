version: "2"
sql:
  - engine: "postgresql"
    queries: "sqlc/queries"
    schema: "../database/migrations"
    gen:
      go:
        package: "dbgen"
        out: "sqlc/dbgen"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        emit_empty_slices: true
        overrides:
          - db_type: "pg_catalog.int4"
            go_type: "int"
          - db_type: "pg_catalog.int8"
            go_type: "int64"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "json"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          # Sitzungs-Metadaten (Berichtskopf) und der Abschlusszeitpunkt der
          # Berichtsliste sind reine Event-Projektionen über LEFT JOIN LATERAL;
          # sqlc kann deren NULL-Barkeit nicht ableiten, daher hier explizit
          # nullable, damit fehlende Events (z. B. offene Sitzung) sauber
          # gescannt werden statt beim NULL-Scan zu scheitern.
          - column: "*.eroeffnet_am"
            go_type: "database/sql.NullTime"
          - column: "*.abgeschlossen_am"
            go_type: "database/sql.NullTime"
          - column: "*.abgeschlossen_von"
            go_type: "database/sql.NullString"
