version: "2"

# golangci-lint runs twice (`make check-backend` / `make lint-backend-full`, CI
# job `backend-golangci`): the CLI's --build-tags merges with this default, so
# the second pass loads [integration unit]. The integration-only pass stays
# because whole-program linters (e.g. unused) judge each file set on its own.
run:
  build-tags:
    - integration

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - bodyclose
    - errorlint
    - gocritic
    - nilerr
    - forbidigo
  disable:
    - wsl
    - exhaustive
    - exhaustruct
  settings:
    gosec:
      excludes:
        - G115 # false positives on safe casts
        - G117 # implicit memory aliasing in for loops — resolved in Go 1.22+
        - G704 # SSRF-Taint auf die fiskaly-Basis-URL: sie stammt aus der Konfiguration (FiskalyBaseURL), nie aus Request-Daten — false positive
    forbidigo:
      # The pattern matches the selector as it stands in the source
      # (q.KassensitzungenRepo.GetOffeneKassensitzung), without the call
      # parenthesis; the $ anchor is what keeps GetOffeneKassensitzungNr and the
      # repository-internal r.GetOffeneKassensitzung allowed. analyze-types stays
      # unset: with it the matched text becomes <package>.<Interface>.<Method>,
      # which this pattern misses — the rule then reports nothing at all.
      forbid:
        - pattern: 'KassensitzungenRepo\.GetOffeneKassensitzung$'
          msg: call KassensitzungenRepo.GetAktiveKassensitzung instead; GetOffeneKassensitzung misses the barrier status wird_abgeschlossen
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy # ranging over slices of large structs (e.g. Position, 128 bytes) by value is acceptable here

formatters:
  enable:
    - goimports

output:
  sort-order:
    - file
