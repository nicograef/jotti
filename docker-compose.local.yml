# Local / LAN deployment — reachable from phones in the same WLAN under the
# trusted hostname <lan-ip>.<install-id>.lokal.jotti.rocks (real Let's Encrypt
# certificate); the host's local IP stays a fallback on Caddy's internal CA
# (browser warning on first access). Intended for the smallest setup: one
# direct-sales till, cash only, no receipt printing
# (docs/leitfaden/installation.md).
# SECURITY: never expose this stack to the public internet (no port forwarding).

name: jotti-local

# Log rotation that needs no daemon configuration, so it applies on any host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.8
    container_name: jotti-postgres-local
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jotti
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # jotti-config holds the install secret (.env mirror) the starter writes
      # before the stack comes up. Mounted read-only only to bind its lifecycle
      # to the data: `down -v` removes secret and database together, so a stale
      # secret cannot lock you out. Postgres never reads it.
      - jotti-config:/jotti-config:ro
      # jotti-backups holds the timestamped pre-update pg_dumps the starter
      # writes before migrating a new version; rw so the dump lands straight in
      # the volume, lifecycle bound to the data like jotti-config.
      - jotti-backups:/jotti-backups
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d jotti"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./database
      dockerfile: migrate/Dockerfile
    container_name: jotti-migrate-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - db-network
    volumes:
      - ./database/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jotti-backend-local
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DBNAME: jotti
      JWT_SECRET: ${JWT_SECRET}
      RELAY_AUTH_TOKEN: ${RELAY_AUTH_TOKEN}
      # Demo/Staging: schaltet nur das CLI-Subkommando `jotti seed` frei (genutzt von
      # reset-and-seed.sh), nicht den HTTP-Endpoint. In Prod/Release nie gesetzt.
      JOTTI_ALLOW_SEED: "1"
    networks:
      - app-network
      - db-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/health >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jotti-frontend-local
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  reverse-proxy:
    build:
      context: ./reverse-proxy
      dockerfile: Dockerfile
    container_name: jotti-reverse-proxy-local
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Host LAN IP, detected on the host and passed in by `make local-up`
      # (a bridged container can only see its docker-bridge IP, which phones
      # cannot reach). Empty ⇒ only the fallback site is announced.
      LAN_IP: ${LAN_IP:-}
      ACMEDNS_BASE_URL: ${ACMEDNS_BASE_URL:-https://auth.jotti.rocks}
      # Set to 1 in development to issue via the Let's Encrypt staging CA.
      PROXY_LE_STAGING: ${PROXY_LE_STAGING:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Status page: bound to host loopback only — visible on the till PC, never
      # on the WLAN.
      - "127.0.0.1:8484:8484"
    volumes:
      - caddy-data:/data
      - proxy-state:/state
    networks:
      - app-network
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S -O /dev/null http://127.0.0.1:80/ 2>&1 | grep -qE 'HTTP/1.[01] (2|3)[0-9][0-9]'",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  caddy-data:
  proxy-state:
  jotti-config:
  jotti-backups:
