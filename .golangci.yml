version: '2'

# One pass covers every file: unit tests are untagged, integration tests carry
# the integration tag.
run:
  build-tags:
    - integration

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - bodyclose
    - errorlint
    - gocritic
    - nilerr
    - forbidigo
    - exhaustive
    - nolintlint
  settings:
    # An ignored member stands as an explicit empty case: a default would also
    # swallow every member added later.
    exhaustive:
      default-signifies-exhaustive: false
    nolintlint:
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        - G115 # false positives on safe casts
        - G704 # SSRF-Taint auf die fiskaly-Basis-URL: sie stammt aus der Konfiguration (FiskalyBaseURL), nie aus Request-Daten — false positive
    forbidigo:
      # The pattern matches the selector as it stands in the source
      # (q.KassensitzungenRepo.GetOffeneKassensitzung), without the call
      # parenthesis; the $ anchor is what keeps GetOffeneKassensitzungNr and the
      # repository-internal r.GetOffeneKassensitzung allowed. analyze-types stays
      # unset: with it the matched text becomes <package>.<Interface>.<Method>,
      # which this pattern misses — the rule then reports nothing at all.
      forbid:
        - pattern: 'KassensitzungenRepo\.GetOffeneKassensitzung$'
          msg: call KassensitzungenRepo.GetAktiveKassensitzung instead; GetOffeneKassensitzung misses the barrier status wird_abgeschlossen
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy # ranging over slices of large structs (e.g. Position, 128 bytes) by value is acceptable here

  exclusions:
    rules:
      # Running a subprocess is these tools' job: the starter drives the docker CLI,
      # the proxy launches Caddy; the arguments come from their own configuration.
      - path: ^(windows/starter|reverse-proxy)/
        linters: [gosec]
        text: G204
      # The Windows tools read their .env and state files from directories they compute.
      - path: ^windows/
        linters: [gosec]
        text: G304
      # Tests read the fixture files they wrote to their own temporary directory.
      - path: _test\.go$
        linters: [gosec]
        text: G304

formatters:
  enable:
    - goimports

output:
  sort-order:
    - file
