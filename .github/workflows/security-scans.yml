name: Security Scans

# Separate from ci.yml on purpose: vulnerability advisories change without any
# code change, so this workflow also runs on a weekly schedule (not just on
# push/pull_request) to surface new advisories against unchanged code.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "resolver/**"
      - "reverse-proxy/**"
      - "windows/**"
      - "frontend/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/security-scans.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "resolver/**"
      - "reverse-proxy/**"
      - "windows/**"
      - "frontend/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/security-scans.yml"
  schedule:
    # Mondays 04:00 UTC, so new advisories are caught even without code
    # changes touching the modules above.
    - cron: "0 4 * * 1"

# Least-privilege token; a job that needs more requests its scopes at job level.
permissions:
  contents: read

# Cancel superseded runs on rapid pushes to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vuln-scan-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - backend
          - resolver
          - reverse-proxy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: govulncheck
        working-directory: ./${{ matrix.module }}
        # Fails (non-zero exit) when govulncheck finds vulnerabilities that
        # are actually reachable from this module's code, matching the
        # required "red on reachable findings" behaviour. Version pinned for
        # reproducibility (same discipline as goimports/golangci-lint in ci.yml).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

  # windows/relay and windows/starter have zero dependencies (no go.sum), so
  # module caching (cache-dependency-path) would fail to resolve a glob and
  # error the step. They get their own job without caching, mirroring
  # windows-ci's "cache: false" in ci.yml.
  vuln-scan-go-windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - windows/relay
          - windows/starter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false

      - name: govulncheck
        working-directory: ./${{ matrix.module }}
        # Fails (non-zero exit) when govulncheck finds vulnerabilities that
        # are actually reachable from this module's code, matching the
        # required "red on reachable findings" behaviour. Version pinned for
        # reproducibility (same discipline as goimports/golangci-lint in ci.yml).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

  vuln-scan-npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking: only production dependencies, red from "high" upward. This
      # is what actually ships in the browser bundle.
      - name: pnpm audit (prod, high and above)
        run: pnpm audit --prod --audit-level high

      # Informational only: full audit including dev dependencies (build
      # tooling, test runners). Findings here never fail the job, but stay
      # visible in the log so new advisories are noticed even though they
      # don't block (e.g. shadcn CLI's transitive hono dependency, or
      # jsdom/vitest's transitive undici dependency).
      - name: pnpm audit (full, informational)
        if: always()
        run: pnpm audit --audit-level high || true
