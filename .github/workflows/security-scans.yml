name: Security Scans

# Separate from ci.yml on purpose: vulnerability advisories change without any
# code change, so this workflow also runs on a weekly schedule (not just on
# push/pull_request) to surface new advisories against unchanged code.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "resolver/**"
      - "reverse-proxy/**"
      - "windows/**"
      - "frontend/**"
      - "website/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/security-scans.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "resolver/**"
      - "reverse-proxy/**"
      - "windows/**"
      - "frontend/**"
      - "website/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/security-scans.yml"
  schedule:
    # Mondays 04:00 UTC.
    - cron: "0 4 * * 1"

# Least-privilege token; a job that needs more requests its scopes at job level.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vuln-scan-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        module:
          - backend
          - resolver
          - reverse-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: govulncheck
        working-directory: ./${{ matrix.module }}
        # govulncheck fails only on vulnerabilities reachable from this module's
        # code; version pinned for reproducibility, like goimports in ci.yml.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # windows/relay and windows/starter have zero dependencies (no go.sum), so
  # module caching (cache-dependency-path) would fail to resolve a glob and
  # error the step. They get their own job without caching, mirroring
  # windows-ci's "cache: false" in ci.yml.
  vuln-scan-go-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        module:
          - windows/relay
          - windows/starter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false

      - name: govulncheck
        working-directory: ./${{ matrix.module }}
        # govulncheck fails only on vulnerabilities reachable from this module's
        # code; version pinned for reproducibility, like goimports in ci.yml.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  vuln-scan-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - frontend
          - website
    defaults:
      run:
        working-directory: ./${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ matrix.project }}/package.json
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking: only production dependencies, red from "high" upward. For
      # frontend this is what ships in the browser bundle; for website it is
      # the build chain of the static jotti.rocks site.
      - name: pnpm audit (prod, high and above)
        run: pnpm audit --prod --audit-level high

      # Informational only: the full audit including dev dependencies never
      # fails the job, but keeps new advisories visible in the log.
      - name: pnpm audit (full, informational)
        if: always()
        run: pnpm audit --audit-level high || true
