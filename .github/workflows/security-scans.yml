name: Security Scans

# Separate from ci.yml on purpose: vulnerability advisories change without any
# code change, so this workflow also runs on a weekly schedule (not just on
# push/pull_request) to surface new advisories against unchanged code.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "resolver/**"
      - "reverse-proxy/**"
      - "windows/**"
      - "frontend/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/security-scans.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "resolver/**"
      - "reverse-proxy/**"
      - "windows/**"
      - "frontend/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/security-scans.yml"
  schedule:
    # Mondays 04:00 UTC.
    - cron: "0 4 * * 1"

# Least-privilege token; a job that needs more requests its scopes at job level.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vuln-scan-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - backend
          - resolver
          - reverse-proxy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: govulncheck
        working-directory: ./${{ matrix.module }}
        # govulncheck fails only on vulnerabilities reachable from this module's
        # code; version pinned for reproducibility, like goimports in ci.yml.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

  # windows/relay and windows/starter have zero dependencies (no go.sum), so
  # module caching (cache-dependency-path) would fail to resolve a glob and
  # error the step. They get their own job without caching, mirroring
  # windows-ci's "cache: false" in ci.yml.
  vuln-scan-go-windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - windows/relay
          - windows/starter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: false

      - name: govulncheck
        working-directory: ./${{ matrix.module }}
        # govulncheck fails only on vulnerabilities reachable from this module's
        # code; version pinned for reproducibility, like goimports in ci.yml.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

  vuln-scan-npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking: only production dependencies, red from "high" upward. This
      # is what actually ships in the browser bundle.
      - name: pnpm audit (prod, high and above)
        run: pnpm audit --prod --audit-level high

      # Informational only: the full audit including dev dependencies never
      # fails the job, but keeps new advisories visible in the log.
      - name: pnpm audit (full, informational)
        if: always()
        run: pnpm audit --audit-level high || true
