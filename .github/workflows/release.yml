name: Release

# Produktweite SemVer-Tags (v0.X.Y) auf main sind der einzige Publish-Mechanismus:
# Tag-Push baut, smoke-testet, pusht die Images nach GHCR und veröffentlicht das
# Windows-ZIP; Dispatch ist ein Dry-Run (Version dev-<shortsha>) ohne Publish.
# Kein Test-Rerun: die CI war auf dem getaggten Commit bereits grün; geprüft wird
# nur, was sie nicht abdeckt — der Stack aus docker-compose.release.yml und
# /api/health.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least-privilege default; the release job requests the write scopes it
# actually needs (below) at job level.
permissions:
  contents: read

# Releases serialize instead of aborting a half-finished publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # GitHub-Release anlegen
      packages: write # Images nach GHCR pushen
    env:
      SERVICES: backend frontend migrate reverse-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # volle History inkl. aller Tags für git-cliff

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Version bestimmen
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Release-Notes aus den Conventional Commits seit dem letzten Tag. Läuft in
      # beiden Pfaden; beim Dispatch nur als Vorschau in der Job-Summary.
      - name: Changelog generieren
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Changelog-Vorschau in die Job-Summary
        env:
          CHANGELOG_FILE: ${{ steps.changelog.outputs.changelog }}
        run: |
          {
            echo '## Changelog'
            echo
            cat "$CHANGELOG_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      # --load, damit der Smoke-Test die Images ohne Registry-Push nutzen kann;
      # gepusht wird erst nach bestandenem Smoke-Test.
      - name: Images bauen (--load)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          declare -A ctx=(
            [backend]=./backend
            [frontend]=./frontend
            [migrate]=./database
            [reverse-proxy]=./reverse-proxy
          )
          # migrate backt die Migrationen ins Image (COPY), der Context ist
          # deshalb ./database und das Dockerfile liegt eine Ebene tiefer.
          declare -A dockerfile=(
            [migrate]=./database/migrate/Dockerfile
          )
          # Backend und Frontend brennen die Version zur Bauzeit ein (ldflags
          # bzw. Vite-define); migrate und reverse-proxy kennen kein
          # VERSION-Build-Arg.
          declare -A buildarg=(
            [backend]="VERSION=$VERSION"
            [frontend]="VERSION=$VERSION"
          )
          for svc in $SERVICES; do
            docker buildx build --load \
              ${dockerfile[$svc]:+--file "${dockerfile[$svc]}"} \
              ${buildarg[$svc]:+--build-arg "${buildarg[$svc]}"} \
              --tag "ghcr.io/nicograef/jotti-$svc:$VERSION" \
              --label "org.opencontainers.image.version=$VERSION" \
              "${ctx[$svc]}"
          done

      - name: Image-Tag in der Release-Compose pinnen
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sed -i "s|:RELEASE_VERSION|:$VERSION|g" docker-compose.release.yml

      - name: .env für den Smoke-Test erzeugen
        run: make init

      - name: Smoke-Test — Stack starten
        run: docker compose -f docker-compose.release.yml up -d

      - name: Smoke-Test — auf /api/health warten
        run: |
          for i in $(seq 1 60); do
            if curl -ksf https://localhost/api/health > /dev/null; then
              echo "jotti ist healthy."
              exit 0
            fi
            echo "warte auf jotti ($i/60) ..."
            sleep 5
          done
          echo "Smoke-Test fehlgeschlagen: /api/health wurde nicht healthy."
          exit 1

      # Backup- und Verify-Pfad Ende-zu-Ende gegen den laufenden Release-Stack;
      # der Restore-Pfad bleibt bewusst unautomatisiert (sein psql-Kern ist mit
      # dem Verify identisch). Der Verify bekommt den Dump explizit übergeben,
      # nicht „neuester im Verzeichnis".
      # prod-backup-verify.sh fails on an empty kassenjournal; the demo seed
      # gives the fresh stack events to back up.
      - name: Smoke test — seed demo data
        run: docker compose -f docker-compose.release.yml run --rm --no-deps -e JOTTI_ALLOW_SEED=1 backend seed

      - name: Smoke-Test — Backup ziehen
        id: backup
        run: |
          COMPOSE_FILE=docker-compose.release.yml ./scripts/prod-backup.sh
          dump="$(find backups -maxdepth 1 -type f -name 'jotti-*.sql.gz' -printf '%f\n' | sort | tail -n1)"
          [ -n "$dump" ] || { echo "Kein Dump erzeugt."; exit 1; }
          echo "dump=backups/$dump" >> "$GITHUB_OUTPUT"

      - name: Smoke-Test — Backup verifizieren
        env:
          DUMP: ${{ steps.backup.outputs.dump }}
        run: COMPOSE_FILE=docker-compose.release.yml ./scripts/prod-backup-verify.sh "$DUMP"

      - name: Smoke-Test — Logs bei Fehler
        if: failure()
        run: docker compose -f docker-compose.release.yml logs

      - name: Smoke-Test — Stack stoppen
        if: always()
        run: docker compose -f docker-compose.release.yml down -v

      # Ab hier nur beim echten Release (Tag-Push); der Dry-Run endet hier.
      - name: GHCR-Login
        if: steps.version.outputs.publish == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Images pushen
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            docker push "ghcr.io/nicograef/jotti-$svc:$VERSION"
          done

      - name: Windows-Release-ZIP bauen
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make release-windows VERSION="$VERSION"

      - name: GitHub-Release veröffentlichen
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/jotti-windows-${{ steps.version.outputs.version }}.zip
          body: ${{ steps.changelog.outputs.content }}
