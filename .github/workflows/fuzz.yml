name: Fuzz

# Fuzz targets beyond their seed corpora (`make fuzz`, 90 s each). Scheduled,
# not per-PR: fuzzing is a background correctness net, not a merge gate.
on:
  schedule:
    - cron: '0 3 * * 1' # Weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run fuzz targets
        run: make fuzz

      # Failing fuzz targets write minimized crashers under testdata/fuzz/;
      # upload them so the failure is reproducible locally via `go test`.
      - name: Upload fuzz crashers on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: backend/**/testdata/fuzz/**
          retention-days: 7
