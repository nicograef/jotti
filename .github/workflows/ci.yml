name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token; a job that needs more requests its scopes at job level.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      database: ${{ steps.changes.outputs.database }}
      resolver: ${{ steps.changes.outputs.resolver }}
      proxy: ${{ steps.changes.outputs.proxy }}
      windows: ${{ steps.changes.outputs.windows }}
      website: ${{ steps.changes.outputs.website }}
      scripts: ${{ steps.changes.outputs.scripts }}
      ci: ${{ steps.changes.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'go.work'
              - 'go.work.sum'
            frontend:
              - 'frontend/**'
            database:
              - 'database/**'
            resolver:
              - 'resolver/**'
              - 'backend/go.mod'
              - 'go.work'
              - 'go.work.sum'
            proxy:
              - 'reverse-proxy/**'
              - 'backend/go.mod'
              - 'go.work'
              - 'go.work.sum'
            windows:
              - 'windows/**'
              - 'backend/go.mod'
              - 'go.work'
              - 'go.work.sum'
            website:
              - 'website/**'
              - 'docs/**'
              - 'Makefile'
              - '.dockerignore'
            scripts:
              - 'scripts/**'
            ci:
              - '.github/workflows/ci.yml'

  backend-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true') || (needs.changes.outputs.database == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod tidiness
        run: go mod tidy -diff

      - name: Check format
        run: |
          if [ -n "$(go tool goimports -l .)" ]; then
            echo "Code is not properly formatted:"
            go tool goimports -l .
            exit 1
          fi

      # sqlc reads the queries and database/migrations, so database/** changes
      # run this job too. Same version as scripts/setup-dev-tools.sh.
      - name: Check generated sqlc code
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc diff

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -count=1 -v -race -coverprofile=coverage.out ./...

      - name: Report test coverage
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage: ${COVERAGE}"

  backend-golangci:
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum

      # Version pinned to the local toolchain (scripts/setup-dev-tools.sh) so a
      # green CI and a green `make verify` mean the same thing.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: ./backend

  resolver-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.resolver == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./resolver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: resolver/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod tidiness
        run: go mod tidy -diff

      - name: Check format
        run: |
          if [ -n "$(go tool goimports -l .)" ]; then
            echo "Code is not properly formatted:"
            go tool goimports -l .
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: ./resolver

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -count=1 -v -race ./...

      # docker-compose.rocks.yml builds this image on its host; no other job
      # builds it.
      - name: Build image
        run: docker build .

  local-proxy-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.proxy == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./reverse-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: reverse-proxy/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod tidiness
        run: go mod tidy -diff

      - name: Check format
        run: |
          if [ -n "$(go tool goimports -l .)" ]; then
            echo "Code is not properly formatted:"
            go tool goimports -l .
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: ./reverse-proxy

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -count=1 -v -race ./...

  windows-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.windows == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        module: [relay, starter]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false

      - name: Download dependencies
        working-directory: ./windows/${{ matrix.module }}
        run: go mod download

      - name: Verify dependencies
        working-directory: ./windows/${{ matrix.module }}
        run: go mod verify

      - name: Check go.mod tidiness
        working-directory: ./windows/${{ matrix.module }}
        run: go mod tidy -diff

      - name: Check format
        working-directory: ./windows/${{ matrix.module }}
        run: |
          if [ -n "$(go tool goimports -l .)" ]; then
            echo "Code is not properly formatted:"
            go tool goimports -l .
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: ./windows/${{ matrix.module }}

      - name: Vet
        working-directory: ./windows/${{ matrix.module }}
        run: go vet ./...

      - name: Build
        working-directory: ./windows/${{ matrix.module }}
        run: go build -v ./...

      - name: Test
        working-directory: ./windows/${{ matrix.module }}
        run: go test -count=1 -v -race ./...

  frontend-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.frontend == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  website-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.website == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: website/package.json
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./website
        run: pnpm install --frozen-lockfile

      - name: Website checks
        run: make website-check

      # Like resolver-ci: only the jotti.rocks host builds this image. The
      # build context is the repository root (website/Dockerfile, .dockerignore).
      - name: Build image
        run: docker build -f website/Dockerfile .

  shellcheck-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.scripts == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck -x scripts/*.sh

  # Repo-wide gates that belong to no single component: the check-*.sh scripts,
  # actionlint and the repo-wide Prettier check. Unconditional: every gate reads the whole
  # tree, so no path filter narrows it correctly.
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run repo checks
        run: make check-repo

      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          make check-workflows

      - name: Check formatting
        run: make check-format

  backend-integration-tests:
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true') || (needs.changes.outputs.database == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: jotti
        ports:
          - 5432:5432
        # Health check over TCP instead of the unix socket: during initialization
        # the postgres image runs a temporary socket-only server that is restarted
        # afterwards; only the final server accepts TCP connections. Matches the
        # startup-race hardening in scripts/test-integration.sh.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U admin -d jotti"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build the migrate image
        working-directory: .
        run: docker build -t jotti-migrate:ci -f database/migrate/Dockerfile database

      - name: Run database migrations up
        run: |
          docker run --rm --network host jotti-migrate:ci \
            /usr/local/bin/migrate -path /migrations -database "postgres://admin:admin@localhost:5432/jotti?sslmode=disable" up

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DBNAME: jotti
          JWT_SECRET: test-secret
          RELAY_AUTH_TOKEN: test-relay-token
        # -p 1 serializes package test binaries: all integration tests share the single
        # Postgres service, so running packages in parallel pollutes each other's data
        # (e.g. user cleanup races kassenjournal inserts). Matches scripts/test-integration.sh.
        run: go test -tags=integration -count=1 -v -race -p 1 ./...

  # Upgrade-path harness: a database migrated and filled with the PREVIOUS
  # release's images must survive the upgrade to the current checkout (migrate
  # up, boot, rebuild-projections). PREVIOUS_VERSION is raised after every
  # release; the job is the mandatory gate for schema changes. Details:
  # database/migrations/README.md.
  upgrade-path:
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true') || (needs.changes.outputs.database == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIOUS_VERSION: v0.18.0
      # Throwaway CI-only values (no secrets); long enough to pass the
      # backend's secret validation (config.MinSecretLength).
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: upgrade-harness-postgres-password
      POSTGRES_DBNAME: jotti
      JWT_SECRET: upgrade-harness-jwt-secret
      RELAY_AUTH_TOKEN: upgrade-harness-relay-token
      DATABASE_URL: postgres://admin:upgrade-harness-postgres-password@localhost:5432/jotti?sslmode=disable
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: admin
          # Must match the job-level POSTGRES_PASSWORD (services cannot
          # reference job env, hence the duplication).
          POSTGRES_PASSWORD: upgrade-harness-postgres-password
          POSTGRES_DB: jotti
        ports:
          - 5432:5432
        # Health check over TCP instead of the unix socket, see the
        # backend-integration-tests service above.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U admin -d jotti"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum

      - name: Apply previous version's migrations
        run: |
          docker run --rm --network host \
            "ghcr.io/nicograef/jotti-migrate:${PREVIOUS_VERSION}" \
            /usr/local/bin/migrate -path /migrations -database "$DATABASE_URL" up

      # The seed guard (JOTTI_ALLOW_SEED) protects real instances; the harness
      # sets it explicitly. The second guard (empty kassenjournal) holds on the
      # freshly migrated database. Seeding fails hard otherwise, so the
      # following steps are guaranteed to run against populated data.
      - name: Seed previous version's demo data
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_USER \
            -e POSTGRES_PASSWORD -e POSTGRES_DBNAME \
            -e JWT_SECRET -e RELAY_AUTH_TOKEN \
            -e JOTTI_ALLOW_SEED=1 \
            "ghcr.io/nicograef/jotti-backend:${PREVIOUS_VERSION}" seed

      - name: Build the current migrate image
        run: docker build -t jotti-migrate:ci -f database/migrate/Dockerfile database

      - name: Migrate to the current checkout's schema
        run: |
          docker run --rm --network host jotti-migrate:ci \
            /usr/local/bin/migrate -path /migrations -database "$DATABASE_URL" up

      - name: Build current backend
        working-directory: ./backend
        run: go build -o /tmp/jotti .

      - name: Boot current backend against previous version's data
        run: |
          /tmp/jotti &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Backend is healthy on previous version's data."
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Backend process died during boot."
              exit 1
            fi
            echo "waiting for /health ($i/30) ..."
            sleep 2
          done
          echo "Backend did not become healthy."
          exit 1

      - name: Rebuild projections on previous version's data
        run: /tmp/jotti rebuild-projections

  # End-to-end tests (Playwright) against the REAL stack: the prod images are
  # built from the checkout via docker-compose.e2e.yml (HTTP-only, fixed test
  # secrets, JOTTI_ENABLE_TEST_API=1).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start the E2E stack
        env:
          E2E_HTTP_PORT: "8080"
        run: docker compose -p jotti-e2e-ci -f docker-compose.e2e.yml up -d --build

      - name: Wait for the stack to become healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$code" = "200" ]; then
              echo "Reverse-Proxy is up (HTTP $code)."
              exit 0
            fi
            echo "waiting for the stack ($i/60), last status: ${code:-none} ..."
            sleep 2
          done
          echo "Stack did not become healthy; dumping container status and logs."
          docker compose -p jotti-e2e-ci -f docker-compose.e2e.yml ps
          docker compose -p jotti-e2e-ci -f docker-compose.e2e.yml logs
          exit 1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: e2e/package.json
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./e2e
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ./e2e
        run: pnpm typecheck

      - name: Install Playwright Chromium
        working-directory: ./e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: ./e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: pnpm test

      - name: Upload Playwright artefacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Dump stack logs on failure
        if: ${{ failure() }}
        run: docker compose -p jotti-e2e-ci -f docker-compose.e2e.yml logs

      - name: Tear down the E2E stack
        if: ${{ always() }}
        run: docker compose -p jotti-e2e-ci -f docker-compose.e2e.yml down -v
