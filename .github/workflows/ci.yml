name: CI

# Every push on any branch, so a feature branch is measured while it is still a branch.
on:
  push:
    branches: ['**']
  # Public repo: a fork's push runs in the fork, so its PR needs this trigger.
  pull_request:
    branches: [main]

# Least-privilege token; a job that needs more requests its scopes at job level.
permissions:
  contents: read

# The event name keeps a push run and a pull_request run from cancelling each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      database: ${{ steps.changes.outputs.database }}
      resolver: ${{ steps.changes.outputs.resolver }}
      proxy: ${{ steps.changes.outputs.proxy }}
      windows: ${{ steps.changes.outputs.windows }}
      einzeldatei: ${{ steps.changes.outputs.einzeldatei }}
      website: ${{ steps.changes.outputs.website }}
      scripts: ${{ steps.changes.outputs.scripts }}
      e2e: ${{ steps.changes.outputs.e2e }}
      ci: ${{ steps.changes.outputs.ci }}
      golangci-lint: ${{ steps.lint-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # scripts/setup-dev-tools.sh holds the pin, so CI and a dev machine run one golangci-lint.
      - name: Read the golangci-lint version
        id: lint-version
        run: |
          VERSION="$(sed -n 's/^GOLANGCI_LINT_VERSION="\(.*\)"$/\1/p' scripts/setup-dev-tools.sh)"
          [ -n "$VERSION" ] || { echo "No GOLANGCI_LINT_VERSION in scripts/setup-dev-tools.sh."; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'go.work'
              - 'go.work.sum'
              - 'scripts/setup-dev-tools.sh'
              - '.golangci.yml'
              - 'Makefile'
            frontend:
              - 'frontend/**'
            database:
              - 'database/**'
              # the restore drill in upgrade-path
              - 'docker-compose.prod.yml'
              - 'scripts/prod-backup-verify.sh'
              - 'scripts/lib.sh'
            resolver:
              - 'resolver/**'
              - 'backend/go.mod'
              - 'go.work'
              - 'go.work.sum'
              - 'scripts/setup-dev-tools.sh'
              - '.golangci.yml'
              - 'Makefile'
            proxy:
              - 'reverse-proxy/**'
              - 'backend/go.mod'
              - 'go.work'
              - 'go.work.sum'
              - 'scripts/setup-dev-tools.sh'
              - '.golangci.yml'
              - 'Makefile'
            windows:
              - 'windows/**'
              # the starter's stack contract test reads them
              - 'docker-compose.local.yml'
              - 'docker-compose.release.yml'
              - 'packaging/windows/**'
              - 'backend/go.mod'
              - 'go.work'
              - 'go.work.sum'
              - 'scripts/setup-dev-tools.sh'
              - '.golangci.yml'
              - 'Makefile'
            # Everything jotti.exe embeds or builds from.
            einzeldatei:
              - 'windows/**'
              - 'backend/**'
              - 'reverse-proxy/**'
              - 'frontend/**'
              - 'database/migrations/**'
              - 'scripts/einzeldatei-*.sh'
              - 'go.work'
              - 'go.work.sum'
              - 'scripts/setup-dev-tools.sh'
              - '.golangci.yml'
              - 'Makefile'
            website:
              - 'website/**'
              - 'docs/**'
              - 'TERMS.md'
              - 'Makefile'
              - 'reverse-proxy/Dockerfile*'
            scripts:
              - 'scripts/**'
            # Everything the E2E stack builds from, plus the suite itself.
            e2e:
              - 'e2e/**'
              - 'docker-compose.e2e.yml'
              - 'backend/**'
              - 'frontend/**'
              - 'database/**'
              - 'reverse-proxy/**'
              - '.node-version'
              - 'scripts/e2e-stack.sh'
              - 'scripts/lib.sh'
              - 'Makefile'
            ci:
              - '.github/workflows/ci.yml'

  backend-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true') || (needs.changes.outputs.database == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod tidiness
        run: go mod tidy -diff

      - name: Vet and check format
        working-directory: .
        run: make lint-backend

      # sqlc reads the queries and database/migrations, so database/** changes
      # run this job too.
      - name: Check generated sqlc code
        working-directory: .
        run: make check-sqlc

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -count=1 -v -race -coverprofile=coverage.out ./...

      - name: Report test coverage
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage: ${COVERAGE}"

  backend-golangci:
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ needs.changes.outputs.golangci-lint }}
          working-directory: ./backend

  resolver-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.resolver == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: resolver/go.mod
          cache-dependency-path: resolver/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ needs.changes.outputs.golangci-lint }}
          install-only: true

      - name: Check the module
        run: make check-resolver

      # docker-compose.rocks.yml builds this image on its host; no other job
      # builds it.
      - name: Build image
        working-directory: ./resolver
        run: docker build .

  local-proxy-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.proxy == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: reverse-proxy/go.mod
          cache-dependency-path: reverse-proxy/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ needs.changes.outputs.golangci-lint }}
          install-only: true

      - name: Check the module
        run: make check-local-proxy

  windows-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.windows == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        module: [relay, starter]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: windows/${{ matrix.module }}/go.mod
          cache: false

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ needs.changes.outputs.golangci-lint }}
          install-only: true

      - name: Check the module
        run: make check-${{ matrix.module }}

  # The starter's _windows.go code calls Win32 security APIs; only a Windows host runs it.
  windows-native:
    needs: changes
    if: ${{ (needs.changes.outputs.windows == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./windows/starter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: windows/starter/go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  einzeldatei-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.einzeldatei == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: windows/einzeldatei/go.mod
          cache-dependency-path: windows/einzeldatei/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ needs.changes.outputs.golangci-lint }}
          install-only: true

      - name: Check the module
        run: make check-einzeldatei

  # Cross-compiles jotti.exe as the release does; einzeldatei-windows runs it.
  einzeldatei-build:
    needs: changes
    if: ${{ (needs.changes.outputs.einzeldatei == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: windows/einzeldatei/go.mod
          cache-dependency-path: windows/einzeldatei/go.sum

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build jotti.exe
        run: make build-einzeldatei-windows VERSION=v0.0.1-ci

      - name: Upload jotti.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jotti-exe
          path: windows/einzeldatei/jotti.exe
          retention-days: 7

  # Runs jotti.exe on a Windows host: Postgres, migrations, backend and Caddy in one process.
  einzeldatei-windows:
    needs: [changes, einzeldatei-build]
    if: ${{ (needs.changes.outputs.einzeldatei == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      # No run registers with auth.jotti.rocks or spends Let's Encrypt limits.
      ACMEDNS_BASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download jotti.exe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jotti-exe

      - name: Start, serve and stop jotti.exe
        shell: bash
        run: bash scripts/einzeldatei-smoke.sh start ./jotti.exe

  frontend-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.frontend == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  website-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.website == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./website
        run: pnpm install --frozen-lockfile

      - name: Website checks
        run: make website-check

      # Like resolver-ci: only the jotti.rocks host builds the rocks target, the
      # proxy image plus the website.
      - name: Build image
        run: docker build -f reverse-proxy/Dockerfile --target rocks .

  shellcheck-ci:
    needs: changes
    if: ${{ (needs.changes.outputs.scripts == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck -x scripts/*.sh

  # Repo-wide gates that belong to no single component: the check-*.sh scripts,
  # actionlint, zizmor and the repo-wide Prettier check. Unconditional: every gate reads the whole
  # tree, so no path filter narrows it correctly.
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run repo checks
        run: make check-repo

      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          make check-workflows

      # Public repo with fork PRs: audit the workflows for injection and token risks.
      # The online audits read action refs and advisories with the job token.
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 .github/workflows

      - name: Check formatting
        run: make check-format

  # Every push: a secret can land in any file. Reviewed false positives carry their
  # fingerprint in .gitleaksignore.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the scan covers every commit, not only the tip

      # The digest is the release's checksums.txt entry; update it together with the version.
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks

      # --redact keeps a found secret out of the public run log.
      - name: gitleaks
        run: gitleaks git --redact --no-banner .

  backend-integration-tests:
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true') || (needs.changes.outputs.database == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: jotti
        ports:
          - 5432:5432
        # Health check over TCP instead of the unix socket: during initialization
        # the postgres image runs a temporary socket-only server that is restarted
        # afterwards; only the final server accepts TCP connections. Matches the
        # startup-race hardening in start_throwaway_postgres in scripts/lib.sh.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U admin -d jotti"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build the migrate image
        working-directory: .
        run: docker build -t jotti-migrate:ci -f database/migrate/Dockerfile database

      - name: Run database migrations up
        run: |
          docker run --rm --network host jotti-migrate:ci \
            /usr/local/bin/migrate -path /migrations -database "postgres://admin:admin@localhost:5432/jotti?sslmode=disable" up

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DBNAME: jotti
          JWT_SECRET: test-secret
          RELAY_AUTH_TOKEN: test-relay-token
        # -p 1: see scripts/test-integration.sh.
        run: go test -tags=integration -count=1 -v -race -p 1 ./...

  # Upgrade-path harness: a database migrated and filled with the previous
  # release's images must survive the upgrade to the current checkout (migrate
  # up, boot with its projection rebuild), and its backup must restore. The previous
  # release is the latest published GitHub release (release.yml publishes it only
  # after its images are on GHCR); the job is the mandatory gate for
  # schema changes. Details: database/migrations/README.md.
  upgrade-path:
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true') || (needs.changes.outputs.database == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Throwaway CI-only values (no secrets); long enough to pass the
      # backend's secret validation (config.MinSecretLength).
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: upgrade-harness-postgres-password
      POSTGRES_DBNAME: jotti
      JWT_SECRET: upgrade-harness-jwt-secret
      RELAY_AUTH_TOKEN: upgrade-harness-relay-token
      DATABASE_URL: postgres://admin:upgrade-harness-postgres-password@localhost:5432/jotti?sslmode=disable
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: admin
          # Must match the job-level POSTGRES_PASSWORD (services cannot
          # reference job env, hence the duplication).
          POSTGRES_PASSWORD: upgrade-harness-postgres-password
          POSTGRES_DB: jotti
        ports:
          - 5432:5432
        # Health check over TCP instead of the unix socket, see the
        # backend-integration-tests service above.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U admin -d jotti"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # release.yml publishes the GitHub release only after its images are on GHCR.
      - name: Determine the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_VERSION="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "Previous release: $PREVIOUS_VERSION"
          echo "PREVIOUS_VERSION=$PREVIOUS_VERSION" >> "$GITHUB_ENV"

      - name: Apply previous version's migrations
        run: |
          docker run --rm --network host \
            "ghcr.io/nicograef/jotti-migrate:${PREVIOUS_VERSION}" \
            /usr/local/bin/migrate -path /migrations -database "$DATABASE_URL" up

      # The seed guard (JOTTI_ALLOW_SEED) protects real instances; the harness
      # sets it explicitly. The second guard (empty kassenjournal) holds on the
      # freshly migrated database. Seeding fails hard otherwise, so the
      # following steps are guaranteed to run against populated data.
      - name: Seed previous version's demo data
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_USER \
            -e POSTGRES_PASSWORD -e POSTGRES_DBNAME \
            -e JWT_SECRET -e RELAY_AUTH_TOKEN \
            -e JOTTI_ALLOW_SEED=1 \
            "ghcr.io/nicograef/jotti-backend:${PREVIOUS_VERSION}" seed

      - name: Build the current migrate image
        run: docker build -t jotti-migrate:ci -f database/migrate/Dockerfile database

      - name: Migrate to the current checkout's schema
        run: |
          docker run --rm --network host jotti-migrate:ci \
            /usr/local/bin/migrate -path /migrations -database "$DATABASE_URL" up

      - name: Build current backend
        working-directory: ./backend
        run: go build -o /tmp/jotti .

      - name: Boot current backend against previous version's data
        run: |
          /tmp/jotti &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Backend is healthy on previous version's data."
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Backend process died during boot."
              exit 1
            fi
            echo "waiting for /health ($i/30) ..."
            sleep 2
          done
          echo "Backend did not become healthy."
          exit 1

      # The rollback of a forward-only migration is a backup restore. The dump is taken
      # like scripts/prod-backup.sh takes it; prod-backup-verify.sh needs a .env.
      - name: Restore drill on the upgraded data
        env:
          SOURCE: ${{ job.services.postgres.id }}
        run: |
          set -o pipefail
          docker exec "$SOURCE" pg_dump --clean --if-exists -U "$POSTGRES_USER" -d "$POSTGRES_DBNAME" \
            | gzip -c > "$RUNNER_TEMP/jotti-drill.sql.gz"
          make init
          ./scripts/prod-backup-verify.sh "$RUNNER_TEMP/jotti-drill.sql.gz"

  # End-to-end tests (Playwright) against the REAL stack: the prod images are
  # built from the checkout via docker-compose.e2e.yml (HTTP-only, fixed test
  # secrets, JOTTI_ENABLE_TEST_API=1).
  e2e:
    needs: changes
    if: ${{ (needs.changes.outputs.e2e == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: e2e/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install dependencies, check format, types and lint
        run: make check-e2e

      - name: Install Playwright Chromium
        working-directory: ./e2e
        run: pnpm exec playwright install --with-deps chromium

      # e2e-stack.sh builds and starts the stack, dumps its logs when the suite
      # fails and removes it with its volumes.
      - name: Run E2E suite
        env:
          E2E_STACK_PROJECT: jotti-e2e-ci
        run: ./scripts/e2e-stack.sh pnpm --dir e2e test

      - name: Upload Playwright artefacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
