name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      database: ${{ steps.changes.outputs.database }}
      resolver: ${{ steps.changes.outputs.resolver }}
      proxy: ${{ steps.changes.outputs.proxy }}
      windows: ${{ steps.changes.outputs.windows }}
      website: ${{ steps.changes.outputs.website }}
      scripts: ${{ steps.changes.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            database:
              - 'database/**'
            resolver:
              - 'resolver/**'
            proxy:
              - 'reverse-proxy/**'
            windows:
              - 'windows/**'
            website:
              - 'website/**'
            scripts:
              - 'scripts/**'

  backend-ci:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check format
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.40.0
          if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
            echo "Code is not properly formatted:"
            goimports -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -tags=unit -v -race -coverprofile=coverage.out ./...

      - name: Report test coverage
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage: ${COVERAGE}"

  backend-golangci:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ./backend

  resolver-ci:
    needs: changes
    if: ${{ needs.changes.outputs.resolver == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./resolver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache-dependency-path: resolver/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check format
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.40.0
          if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
            echo "Code is not properly formatted:"
            goimports -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race ./...

  local-proxy-ci:
    needs: changes
    if: ${{ needs.changes.outputs.proxy == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./reverse-proxy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache-dependency-path: reverse-proxy/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check format
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.40.0
          if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
            echo "Code is not properly formatted:"
            goimports -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race ./...

  windows-ci:
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [relay, starter]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache: false

      - name: Download dependencies
        working-directory: ./windows/${{ matrix.module }}
        run: go mod download

      - name: Verify dependencies
        working-directory: ./windows/${{ matrix.module }}
        run: go mod verify

      - name: Check format
        working-directory: ./windows/${{ matrix.module }}
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.40.0
          if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
            echo "Code is not properly formatted:"
            goimports -l .
            exit 1
          fi

      - name: Vet
        working-directory: ./windows/${{ matrix.module }}
        run: go vet ./...

      - name: Build
        working-directory: ./windows/${{ matrix.module }}
        run: go build -v ./...

      - name: Test
        working-directory: ./windows/${{ matrix.module }}
        run: go test -v -race ./...

  frontend-ci:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  website-ci:
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./website
        run: pnpm install --frozen-lockfile

      - name: Website checks
        run: make website-check

  shellcheck-ci:
    needs: changes
    if: ${{ needs.changes.outputs.scripts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  backend-integration-tests:
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true') || (needs.changes.outputs.database == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.8
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: jotti
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install golang-migrate
        run: |
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Run database migrations up
        working-directory: ./database
        run: migrate -path ./migrations -database "postgres://admin:admin@localhost:5432/jotti?sslmode=disable" up

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DBNAME: jotti
          JWT_SECRET: test-secret
        # -p 1 serializes package test binaries: all integration tests share the single
        # Postgres service, so running packages in parallel pollutes each other's data
        # (e.g. user cleanup races kassenjournal inserts). Matches scripts/test-integration.sh.
        run: go test -tags=integration -v -race -p 1 ./...

      - name: Run database migrations down
        if: always()
        working-directory: ./database
        run: migrate -path ./migrations -database "postgres://admin:admin@localhost:5432/jotti?sslmode=disable" down -all
