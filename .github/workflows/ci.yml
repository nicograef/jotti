name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token; a job that needs more requests its scopes at job level.
permissions:
  contents: read

# Cancel superseded runs on rapid pushes to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      database: ${{ steps.changes.outputs.database }}
      resolver: ${{ steps.changes.outputs.resolver }}
      proxy: ${{ steps.changes.outputs.proxy }}
      windows: ${{ steps.changes.outputs.windows }}
      website: ${{ steps.changes.outputs.website }}
      scripts: ${{ steps.changes.outputs.scripts }}
      ci: ${{ steps.changes.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            database:
              - 'database/**'
            resolver:
              - 'resolver/**'
            proxy:
              - 'reverse-proxy/**'
            windows:
              - 'windows/**'
            website:
              - 'website/**'
            scripts:
              - 'scripts/**'
            ci:
              - '.github/workflows/ci.yml'

  backend-ci:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod tidiness
        run: go mod tidy -diff

      - name: Check format
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.40.0
          if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
            echo "Code is not properly formatted:"
            goimports -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -tags=unit -count=1 -v -race -coverprofile=coverage.out ./...

      - name: Report test coverage
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage: ${COVERAGE}"

  backend-golangci:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: backend/go.sum

      # Version pinned to the local toolchain (scripts/setup-dev-tools.sh) so a
      # green CI and a green `make verify` mean the same thing (D13).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: ./backend

  resolver-ci:
    needs: changes
    if: ${{ needs.changes.outputs.resolver == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./resolver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: resolver/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod tidiness
        run: go mod tidy -diff

      - name: Check format
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.40.0
          if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
            echo "Code is not properly formatted:"
            goimports -l .
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: ./resolver

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -count=1 -v -race ./...

  local-proxy-ci:
    needs: changes
    if: ${{ needs.changes.outputs.proxy == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./reverse-proxy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: reverse-proxy/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod tidiness
        run: go mod tidy -diff

      - name: Check format
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.40.0
          if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
            echo "Code is not properly formatted:"
            goimports -l .
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: ./reverse-proxy

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -count=1 -v -race ./...

  windows-ci:
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [relay, starter]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false

      - name: Download dependencies
        working-directory: ./windows/${{ matrix.module }}
        run: go mod download

      - name: Verify dependencies
        working-directory: ./windows/${{ matrix.module }}
        run: go mod verify

      - name: Check go.mod tidiness
        working-directory: ./windows/${{ matrix.module }}
        run: go mod tidy -diff

      - name: Check format
        working-directory: ./windows/${{ matrix.module }}
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.40.0
          if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
            echo "Code is not properly formatted:"
            goimports -l .
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: ./windows/${{ matrix.module }}

      - name: Vet
        working-directory: ./windows/${{ matrix.module }}
        run: go vet ./...

      - name: Build
        working-directory: ./windows/${{ matrix.module }}
        run: go build -v ./...

      - name: Test
        working-directory: ./windows/${{ matrix.module }}
        run: go test -count=1 -v -race ./...

  frontend-ci:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  website-ci:
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./website
        run: pnpm install --frozen-lockfile

      - name: Website checks
        run: make website-check

  shellcheck-ci:
    needs: changes
    if: ${{ needs.changes.outputs.scripts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  backend-integration-tests:
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true') || (needs.changes.outputs.database == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.8
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: jotti
        ports:
          - 5432:5432
        # Health check over TCP instead of the unix socket: during initialization
        # postgres:17 runs a temporary socket-only server that is restarted
        # afterwards; only the final server accepts TCP connections. Matches the
        # startup-race hardening in scripts/test-integration.sh.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U admin -d jotti"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install golang-migrate
        run: |
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Run database migrations up
        working-directory: ./database
        run: migrate -path ./migrations -database "postgres://admin:admin@localhost:5432/jotti?sslmode=disable" up

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DBNAME: jotti
          JWT_SECRET: test-secret
          RELAY_AUTH_TOKEN: test-relay-token
        # -p 1 serializes package test binaries: all integration tests share the single
        # Postgres service, so running packages in parallel pollutes each other's data
        # (e.g. user cleanup races kassenjournal inserts). Matches scripts/test-integration.sh.
        run: go test -tags=integration -count=1 -v -race -p 1 ./...

  # Upgrade-path harness (release guide gate 4 (b), audit C10): a database
  # migrated and filled with the PREVIOUS release's images must survive the
  # upgrade to the current checkout: migrate up, boot, rebuild-projections.
  # PREVIOUS_VERSION pins the previous version to the latest published release
  # and is raised after every release; from the first 02_ migration on, this
  # job is the mandatory gate for schema changes. Pinning plan:
  # database/migrations/README.md.
  upgrade-path:
    needs: changes
    # The job's whole harness lives in this workflow file, so changes to it
    # must re-run the job as well.
    if: ${{ (needs.changes.outputs.backend == 'true') || (needs.changes.outputs.database == 'true') || (needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    env:
      PREVIOUS_VERSION: v0.14.0
      # Throwaway CI-only values (no secrets); long enough to pass the
      # backend's secret validation (config.MinSecretLength).
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: upgrade-harness-postgres-password
      POSTGRES_DBNAME: jotti
      JWT_SECRET: upgrade-harness-jwt-secret
      RELAY_AUTH_TOKEN: upgrade-harness-relay-token
      DATABASE_URL: postgres://admin:upgrade-harness-postgres-password@localhost:5432/jotti?sslmode=disable
    services:
      postgres:
        image: postgres:17.8
        env:
          POSTGRES_USER: admin
          # Must match the job-level POSTGRES_PASSWORD (services cannot
          # reference job env, hence the duplication).
          POSTGRES_PASSWORD: upgrade-harness-postgres-password
          POSTGRES_DB: jotti
        ports:
          - 5432:5432
        # Health check over TCP instead of the unix socket, see the
        # backend-integration-tests service above.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U admin -d jotti"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: backend/go.sum

      - name: Apply previous version's migrations
        run: |
          docker run --rm --network host \
            "ghcr.io/nicograef/jotti-migrate:${PREVIOUS_VERSION}" \
            /usr/local/bin/migrate -path /migrations -database "$DATABASE_URL" up

      # The seed guard (JOTTI_ALLOW_SEED) protects real instances; the harness
      # sets it explicitly. The second guard (empty kassenjournal) holds on the
      # freshly migrated database. Seeding fails hard otherwise, so the
      # following steps are guaranteed to run against populated data.
      - name: Seed previous version's demo data
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_USER \
            -e POSTGRES_PASSWORD -e POSTGRES_DBNAME \
            -e JWT_SECRET -e RELAY_AUTH_TOKEN \
            -e JOTTI_ALLOW_SEED=1 \
            "ghcr.io/nicograef/jotti-backend:${PREVIOUS_VERSION}" seed

      - name: Install golang-migrate
        run: |
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Migrate to the current checkout's schema
        run: migrate -path database/migrations -database "$DATABASE_URL" up

      - name: Build current backend
        working-directory: ./backend
        run: go build -o /tmp/jotti .

      - name: Boot current backend against previous version's data
        run: |
          /tmp/jotti &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Backend is healthy on previous version's data."
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Backend process died during boot."
              exit 1
            fi
            echo "waiting for /health ($i/30) ..."
            sleep 2
          done
          echo "Backend did not become healthy."
          exit 1

      - name: Rebuild projections on previous version's data
        run: /tmp/jotti rebuild-projections

  # End-to-End tests (Playwright) against the REAL stack: the prod images are
  # built from the checkout via docker-compose.e2e.yml (HTTP-only, fixed test
  # secrets, JOTTI_ENABLE_TEST_API=1). The job runs on every pull request and
  # every push to main; on failure, traces and screenshots are uploaded as
  # artefacts.
  e2e:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the E2E stack
        env:
          E2E_HTTP_PORT: "8080"
        run: docker compose -p jotti-e2e-ci -f docker-compose.e2e.yml up -d --build

      - name: Wait for the stack to become healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$code" = "200" ]; then
              echo "Reverse-Proxy is up (HTTP $code)."
              exit 0
            fi
            echo "waiting for the stack ($i/60), last status: ${code:-none} ..."
            sleep 2
          done
          echo "Stack did not become healthy; dumping container status and logs."
          docker compose -p jotti-e2e-ci -f docker-compose.e2e.yml ps
          docker compose -p jotti-e2e-ci -f docker-compose.e2e.yml logs
          exit 1

      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./e2e
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ./e2e
        run: pnpm typecheck

      - name: Install Playwright Chromium
        working-directory: ./e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: ./e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: pnpm test

      - name: Upload Playwright artefacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Dump stack logs on failure
        if: ${{ failure() }}
        run: docker compose -p jotti-e2e-ci -f docker-compose.e2e.yml logs

      - name: Tear down the E2E stack
        if: ${{ always() }}
        run: docker compose -p jotti-e2e-ci -f docker-compose.e2e.yml down -v
