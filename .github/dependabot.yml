version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      backend-gomod:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/resolver"
    schedule:
      interval: "monthly"
    groups:
      resolver-gomod:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/reverse-proxy"
    schedule:
      interval: "monthly"
    groups:
      reverse-proxy-gomod:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/windows/relay"
    schedule:
      interval: "monthly"
    groups:
      relay-gomod:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/windows/starter"
    schedule:
      interval: "monthly"
    groups:
      starter-gomod:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend-npm:
        patterns:
          - "*"
    # TypeScript bleibt auf 6.x, bis typescript-eslint TypeScript 7 unterstuetzt
    # (typescript-eslint#10940). Minor/Patch bleiben erlaubt.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    groups:
      website-npm:
        patterns:
          - "*"
    # TypeScript bleibt auf 6.x, bis @astrojs/check TypeScript 7 unterstuetzt
    # (Peer typescript ^5.0.0 || ^6.0.0). Minor/Patch bleiben erlaubt.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "monthly"
    groups:
      e2e-npm:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/database/migrate"
      - "/frontend"
      - "/resolver"
      - "/reverse-proxy"
      - "/website"
    schedule:
      interval: "monthly"
    # scripts/check-pins.sh verlangt je Image eine Version: group-by hebt ein Image
    # in einem PR ueber alle Verzeichnisse an. Pins in den Compose-Dateien deckt
    # dieser Eintrag nicht ab; sie von Hand mitziehen.
    groups:
      docker:
        group-by: dependency-name
        patterns:
          - "*"
    # Node ist im Image nur Build-Tool; auf dem Active LTS (24) bleiben, bis die
    # naechste LTS-Linie steht. Minor/Patch bleiben erlaubt.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
