version: 2

multi-ecosystem-groups:
  docker:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      backend-gomod:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/resolver"
    schedule:
      interval: "monthly"
    groups:
      resolver-gomod:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/reverse-proxy"
    schedule:
      interval: "monthly"
    groups:
      reverse-proxy-gomod:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/windows/relay"
    schedule:
      interval: "monthly"
    groups:
      relay-gomod:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/windows/starter"
    schedule:
      interval: "monthly"
    groups:
      starter-gomod:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend-npm:
        patterns:
          - "*"
    # TypeScript bleibt auf 6.x, bis typescript-eslint TypeScript 7 unterstuetzt
    # (typescript-eslint#10940). Minor/Patch bleiben erlaubt.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    groups:
      website-npm:
        patterns:
          - "*"
    # TypeScript bleibt auf 6.x, bis @astrojs/check TypeScript 7 unterstuetzt
    # (Peer typescript ^5.0.0 || ^6.0.0). Minor/Patch bleiben erlaubt.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "monthly"
    groups:
      e2e-npm:
        patterns:
          - "*"

  # scripts/check-pins.sh requires one version per image across Dockerfiles and
  # compose files, so both ecosystems share one multi-ecosystem PR.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/database/migrate"
      - "/frontend"
      - "/resolver"
      - "/reverse-proxy"
      - "/website"
    multi-ecosystem-group: "docker"
    patterns: ["*"]
    # Node is only a build tool in the images; stay on the Active LTS (24) until
    # the next LTS line is out. Minor and patch stay allowed.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    multi-ecosystem-group: "docker"
    patterns: ["*"]
    # Node as above. Postgres majors need a data upgrade path first (D15 in
    # docs/decisions.md).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
