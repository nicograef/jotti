<!-- SEO / Open Graph / Twitter meta — single source for all pages.
     Pages set page_title, page_description, page_canonical and og_type via
     <!--# set --> before including this partial. og_image (and its dimensions)
     default to the shared preview card and can be overridden per page. -->
<meta name="description" content="<!--# echo var="page_description" default="" -->" />
<meta name="author" content="Nico Gräf" />
<meta name="robots" content="index, follow" />

<title><!--# echo var="page_title" default="" --></title>

<link rel="canonical" href="<!--# echo var="page_canonical" default="" -->" />

<!-- Open Graph -->
<meta property="og:type" content="<!--# echo var="og_type" default="website" -->" />
<meta property="og:title" content="<!--# echo var="page_title" default="" -->" />
<meta property="og:description" content="<!--# echo var="page_description" default="" -->" />
<meta property="og:site_name" content="jotti" />
<meta property="og:locale" content="de_DE" />
<meta property="og:url" content="<!--# echo var="page_canonical" default="" -->" />
<meta property="og:image" content="<!--# echo var="og_image" default="https://jotti.rocks/img/jotti-bon.webp" -->" />
<meta property="og:image:width" content="<!--# echo var="og_image_width" default="1200" -->" />
<meta property="og:image:height" content="<!--# echo var="og_image_height" default="655" -->" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="<!--# echo var="page_title" default="" -->" />
<meta name="twitter:description" content="<!--# echo var="page_description" default="" -->" />
<meta name="twitter:image" content="<!--# echo var="og_image" default="https://jotti.rocks/img/jotti-bon.webp" -->" />
