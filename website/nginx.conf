server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  index index.html;

  # gzip for text-based responses (HTML is always compressed when gzip is on).
  # The reverse proxy talks HTTP/1.0 to this upstream (proxy_http_version
  # default), so allow compression below nginx's default of HTTP/1.1.
  gzip on;
  gzip_http_version 1.0;
  gzip_vary on;
  gzip_min_length 256;
  gzip_comp_level 6;
  gzip_types text/css text/javascript application/javascript image/svg+xml application/xml application/json text/xml text/plain;

  # Branded 404 for unknown URLs (Astro emits dist/404.html).
  error_page 404 /404.html;

  # Content-hashed Astro assets (_astro/) — cache forever.
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Pagefind search index — content-hashed, cache forever.
  location ^~ /pagefind/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Self-hosted fonts — immutable.
  location ^~ /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # HTML pages (landing + docs in directory format) and remaining static files.
  # HTML is never cached so a new build shows up immediately after deploy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
